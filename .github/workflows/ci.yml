# =============================================================================
# CI Pipeline - Tests, Linting, and Code Quality
# =============================================================================
# This workflow runs on every push and pull request to ensure code quality.
#
# Jobs:
#   - test: Run Go unit tests with coverage
#   - lint: Run golangci-lint for code quality
#   - frontend: Run frontend type checking
#   - build-check: Build the real frontend and compile the Go binary
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  # ===========================================================================
  # Job: Go Tests
  # ===========================================================================
  test:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # main.go embeds frontend/dist via go:embed, but frontend/dist is
      # gitignored, so a fresh checkout has no embed target and the package
      # fails to compile. The Go unit tests never exercise the embedded
      # assets, so a placeholder file is enough to satisfy the embed
      # directive and keeps this job fast. The build-check job compiles
      # against the real frontend build.
      - name: Create embed placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: |
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          
          # Optional: Fail if coverage is below threshold
          # if (( $(echo "$COVERAGE < 50" | bc -l) )); then
          #   echo "Coverage is below 50%"
          #   exit 1
          # fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true

  # ===========================================================================
  # Job: Go Linting
  # ===========================================================================
  lint:
    name: Go Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Linting typechecks the package, so it needs the go:embed target for
      # frontend/dist just like the test job does. See the test job for why a
      # placeholder is sufficient here.
      - name: Create embed placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      # Pinned to an explicit golangci-lint v2 release. "latest" resolves to
      # the newest v1 release, which is built with Go 1.24 and refuses to run
      # against the go 1.25.0 directive in go.mod.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # ===========================================================================
  # Job: Frontend Type Checking
  # ===========================================================================
  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

  # ===========================================================================
  # Job: Build Verification
  # ===========================================================================
  # This is the only job that compiles against the real embedded frontend, so
  # it must also run on pushes to main. Restricting it to pull requests left
  # main with no job that proved the app actually builds.
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # next.config.js sets output: "export" with distDir: "dist", so this
      # produces the real frontend/dist that main.go embeds via go:embed.
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Verify Go modules
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build Go (without CGO for quick check)
        run: CGO_ENABLED=0 go build -o /dev/null ./...
